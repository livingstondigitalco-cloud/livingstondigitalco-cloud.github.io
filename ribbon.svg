<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="rib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c45a60"/>
      <stop offset="45%" stop-color="#8e2a32"/>
      <stop offset="100%" stop-color="#6b1c24"/>
    </linearGradient>
    <linearGradient id="rib-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97a7e"/>
      <stop offset="100%" stop-color="#8e2a32"/>
    </linearGradient>
    <linearGradient id="knot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b84850"/>
      <stop offset="100%" stop-color="#5a151c"/>
    </linearGradient>
  </defs>
  <!-- draping tails -->
  <path d="M300 118 C 260 128, 200 150, 150 188 C 120 210, 80 230, 46 236" stroke="url(#rib)" stroke-width="16" stroke-linecap="round"/>
  <path d="M300 118 C 340 128, 400 150, 450 188 C 480 210, 520 230, 554 236" stroke="url(#rib)" stroke-width="16" stroke-linecap="round"/>
  <!-- tail tips, slightly folded -->
  <path d="M46 236 L28 252 L54 248 Z" fill="#6b1c24"/>
  <path d="M554 236 L572 252 L546 248 Z" fill="#6b1c24"/>
  <!-- vertical through the hole -->
  <path d="M300 86 L300 156" stroke="#6b1c24" stroke-width="13" stroke-linecap="round"/>
  <path d="M300 86 L300 148" stroke="#a33a42" stroke-width="7" stroke-linecap="round"/>
  <!-- left loop -->
  <path d="M300 78 C 250 20, 160 28, 168 78 C 176 118, 250 118, 300 92" fill="url(#rib-hi)" stroke="#6b1c24" stroke-width="1"/>
  <path d="M232 58 C 250 70, 268 80, 288 88" stroke="#e8a0a4" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <!-- right loop -->
  <path d="M300 78 C 350 20, 440 28, 432 78 C 424 118, 350 118, 300 92" fill="url(#rib-hi)" stroke="#6b1c24" stroke-width="1"/>
  <path d="M368 58 C 350 70, 332 80, 312 88" stroke="#e8a0a4" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <!-- knot -->
  <ellipse cx="300" cy="92" rx="22" ry="18" fill="url(#knot)" stroke="#4a1016" stroke-width="1"/>
  <path d="M286 84 Q 300 90 314 84" stroke="#e8a0a4" stroke-width="2.2" stroke-linecap="round" opacity="0.75"/>
</svg>
