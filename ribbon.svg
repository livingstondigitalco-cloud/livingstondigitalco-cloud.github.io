<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="rib" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b1c24"/>
      <stop offset="18%" stop-color="#8e2a32"/>
      <stop offset="42%" stop-color="#c45a60"/>
      <stop offset="58%" stop-color="#d97a7e"/>
      <stop offset="82%" stop-color="#8e2a32"/>
      <stop offset="100%" stop-color="#6b1c24"/>
    </linearGradient>
  </defs>
  <!-- Thin hanging ribbon loop. The bottom of the loop sits on the hang hole
       at (300, 158), matching the existing JS anchor (anchorY = 158/260).
       The path is left slightly open at the hole so it reads as ribbon
       threaded through, not a closed ring or a bow. -->
  <!-- soft shadow edge -->
  <path d="M293 158
           C 250 148, 232 108, 232 66
           C 232 30, 260 16, 300 16
           C 340 16, 368 30, 368 66
           C 368 108, 350 148, 307 158"
        stroke="#4a1016" stroke-width="8.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.28"/>
  <!-- main thin red ribbon -->
  <path d="M293 158
           C 250 148, 232 108, 232 66
           C 232 30, 260 16, 300 16
           C 340 16, 368 30, 368 66
           C 368 108, 350 148, 307 158"
        stroke="url(#rib)" stroke-width="6.2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- fabric highlight down the face of the ribbon -->
  <path d="M293 158
           C 250 148, 232 108, 232 66
           C 232 30, 260 16, 300 16
           C 340 16, 368 30, 368 66
           C 368 108, 350 148, 307 158"
        stroke="#e8b0b3" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity="0.5"/>
</svg>
