  <!--
    One-piece snowflake from the fixed laser design (filigree is in the wood silhouette). Logo area is the 57 mm inner scored ring; greeting sits in a band at the bottom of the ring.
    Convention:
      viewBox="0 0 1000 1000"  (matches the wood texture)
      data-wood selects assets/img/wood-<name>.webp
      #logo-area   rect  — where the uploaded logo + text are fitted
      #hang-hole   circle — hanging hole (informational; also punched in the wood texture)
      #ENGRAVE     black fills, burned into the wood
      #SCORE       strokes, incised grooves (preview stroke width, not laser 0.1 mm)
    Keep decorations out of the logo area.
  -->
