<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="kc-title kc-desc">
  <title id="kc-title">Basswood logo keychain preview</title>
  <desc id="kc-desc">A 2.5 by 1.25 inch rounded rectangle basswood keychain with a split ring and a placeholder logo engraved in the center.</desc>
  <defs>
    <linearGradient id="ring-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3f0ea"/>
      <stop offset="35%" stop-color="#c8c3b8"/>
      <stop offset="55%" stop-color="#9a958b"/>
      <stop offset="80%" stop-color="#e7e2d6"/>
      <stop offset="100%" stop-color="#8f8a80"/>
    </linearGradient>
    <linearGradient id="ring-inner" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a756c"/>
      <stop offset="50%" stop-color="#d9d4c8"/>
      <stop offset="100%" stop-color="#5e5a53"/>
    </linearGradient>
    <linearGradient id="wood-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0dfb8"/>
      <stop offset="45%" stop-color="#e6d3a6"/>
      <stop offset="100%" stop-color="#d2b682"/>
    </linearGradient>
    <linearGradient id="wood-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9a86a"/>
      <stop offset="100%" stop-color="#8d6a3a"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#3c2814" flood-opacity="0.22"/>
    </filter>
    <clipPath id="face-clip">
      <rect x="168" y="72" width="504" height="176" rx="36" ry="36"/>
    </clipPath>
  </defs>

  <!-- split ring -->
  <g transform="translate(98 160)" filter="url(#soft-shadow)">
    <circle r="54" fill="none" stroke="url(#ring-metal)" stroke-width="14"/>
    <circle r="54" fill="none" stroke="url(#ring-inner)" stroke-width="5" opacity="0.55"/>
    <!-- gap in the ring (split) -->
    <path d="M 18 -52 A 54 54 0 0 1 42 -36" fill="none" stroke="#f6efe3" stroke-width="16" stroke-linecap="butt"/>
    <circle cx="16" cy="-50" r="7.2" fill="url(#ring-metal)" stroke="#7a756c" stroke-width="1"/>
    <circle cx="40" cy="-38" r="7.2" fill="url(#ring-metal)" stroke="#7a756c" stroke-width="1"/>
  </g>

  <!-- keychain body -->
  <g filter="url(#soft-shadow)">
    <rect x="164" y="70" width="512" height="180" rx="38" ry="38" fill="url(#wood-edge)"/>
    <rect x="168" y="72" width="504" height="176" rx="36" ry="36" fill="url(#wood-face)"/>
  </g>

  <!-- wood grain -->
  <g clip-path="url(#face-clip)" fill="none" stroke="#b0894f" stroke-linecap="round" opacity="0.22">
    <path d="M170 100 C 260 92, 360 112, 470 98 S 650 90, 680 108" stroke-width="1.2"/>
    <path d="M170 128 C 280 118, 390 140, 520 126 S 640 120, 680 134" stroke-width="1"/>
    <path d="M170 158 C 250 150, 400 172, 530 156 S 640 150, 680 164" stroke-width="1.3"/>
    <path d="M170 188 C 270 180, 380 202, 510 186 S 640 182, 680 196" stroke-width="1"/>
    <path d="M170 216 C 300 208, 420 226, 560 214 S 650 210, 680 220" stroke-width="0.9"/>
  </g>

  <!-- hanging hole -->
  <g>
    <circle cx="214" cy="160" r="16" fill="#e9dfce" stroke="#8d6a3a" stroke-width="2"/>
    <circle cx="214" cy="160" r="11.5" fill="#f6efe3"/>
    <circle cx="214" cy="160" r="11.5" fill="none" stroke="#5a4134" stroke-width="1" opacity="0.25"/>
  </g>

  <!-- engraved placeholder logo -->
  <g id="kc-placeholder" fill="none" stroke="#5c3a1e" stroke-linecap="round" stroke-linejoin="round" opacity="0.82">
    <circle cx="430" cy="132" r="22" stroke-width="2.2"/>
    <path d="M430 118 L436 128 L447 129 L439 137 L441 148 L430 142 L419 148 L421 137 L413 129 L424 128 Z" fill="#5c3a1e" stroke="none" opacity="0.85"/>
    <text x="430" y="186" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" letter-spacing="3.5" fill="#5c3a1e" stroke="none">YOUR LOGO</text>
  </g>
</svg>
