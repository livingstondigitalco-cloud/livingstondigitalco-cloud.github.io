<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" data-wood="tree" data-name="">
  <!--
    Stylized Christmas tree from the premium laser design (cut stars and diamonds are in the wood silhouette).
    Convention:
      viewBox="0 0 1000 1000"  (matches the wood texture)
      data-wood selects wood-<name>.webp
      #logo-area   rect  — where the uploaded logo + text are fitted
      #hang-hole   circle — hanging hole (informational; also punched in the wood texture)
      #ENGRAVE     black fills, burned into the wood
      #SCORE       strokes, incised grooves (preview stroke width, not laser 0.1 mm)
    Keep decorations out of the logo area.
  -->
  <g id="META">
    <rect id="logo-area" x="378.33" y="410.34" width="243.339" height="243.339" fill="none"/>
    <circle id="hang-hole" cx="500" cy="116.118" r="17.149" fill="none"/>
  </g>
  <g id="ENGRAVE"></g>
